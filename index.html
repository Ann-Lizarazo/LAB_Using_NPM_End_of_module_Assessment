<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA - Foto Astronómica del Día</title>
    <link href="/CSS/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>NASA - Foto Astronómica del Día</h1>
        </header>

        <div class="search-section">
            <div class="search-grid">
                <div class="search-group">
                    <label for="searchName">Buscar un favorito por nombre:</label>
                    <input type="text" id="searchName" placeholder="Ej: Aurora Australis...">
                </div>
                <div class="search-group">
                    <label for="searchDate">Buscar por fecha:</label>
                    <input type="date" id="searchDate" min="1995-06-16">
                </div>
                <div>
                    <button type="button" class="btn" id="searchBtn">Buscar</button>
                </div>
            </div>
            <div class="centrado">
                <button type="button" class="btn btn-secondary" id="todayBtn">Ver foto de hoy</button>
            </div>
        </div>

        <!-- Aquí salen "Cargando…", los errores y los avisos -->
        <p id="mensaje" class="mensaje" role="status" hidden></p>

        <!-- Zona donde mostrarApod pinta la APOD -->
        <div id="apod" hidden>
            <div class="image-container">
                <img id="imagen" src="" alt="">
            </div>
            <div class="details">
                <h2 id="titulo"></h2>
                <p class="date" id="fecha-apod"></p>
                <a id="enlace-video" class="enlace-video" href="#" target="_blank" rel="noopener" hidden>Ver el video en NASA</a>
                <div class="explanation" id="explicacion"></div>
                <button type="button" class="btn btn-favorito" id="btn-favorito">⭐ Guardar en favoritos</button>
            </div>
        </div>

        <section class="favoritos">
            <h2>Mis favoritos</h2>
            <p id="favoritos-vacio" class="favoritos-vacio">Todavía no se tiene favoritos guardados</p>
            <ul id="lista-favoritos" class="lista-favoritos"></ul>
        </section>
    </div>

    <script src="node_modules/dayjs/dayjs.min.js"></script>
    <script src="node_modules/dayjs/locale/es.js"></script>
    <script src="/JS/app.js"></script>
</body>
</html>
